<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran - TOKOKITA DIGITAL</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0b1218;
--card:#111827;
--primary:#145a4a;
--primary-soft:#1f7a63;
--text:#e5e7eb;
--sub:#9ca3af;
--accent:#22c55e;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* BOX */
.box{
background:var(--card);
padding:25px;
border-radius:16px;
max-width:400px;
width:90%;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

/* LOGO */
.logo{
width:70px;
margin-bottom:10px;
}

/* TITLE */
h2{
margin:5px 0;
}

.sub{
font-size:13px;
color:var(--sub);
margin-bottom:15px;
}

/* PRODUCT INFO */
.produk{
background:#0f1720;
padding:10px;
border-radius:10px;
margin-bottom:15px;
font-size:13px;
}

/* STEP */
.step{
text-align:left;
font-size:13px;
margin:10px 0;
color:var(--accent);
line-height:1.6;
}

/* QRIS */
.qris{
background:white;
padding:10px;
border-radius:12px;
margin:15px 0;
}

.qris img{
width:100%;
border-radius:10px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
background:var(--primary);
border:none;
border-radius:10px;
color:white;
font-weight:bold;
font-size:14px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:var(--primary-soft);
}

/* NOTE */
.note{
font-size:12px;
color:var(--sub);
margin-top:10px;
}

/* TRUST */
.trust{
margin-top:10px;
font-size:12px;
color:var(--accent);
}
</style>

</head>

<body>

<div class="box">

<img src="logo.png" class="logo">

<h2>Pembayaran QRIS</h2>
<p class="sub">TOKOKITA DIGITAL</p>

<!-- PRODUK -->
<div class="produk" id="infoProduk">
Memuat produk...
</div>

<div class="step">
✔ Scan QRIS di bawah ini<br>
✔ Bayar sesuai nominal<br>
✔ Klik konfirmasi
</div>

<div class="qris">
<img src="qris-gadozo.png">
</div>

<button onclick="kirimWA()">Saya Sudah Bayar</button>

<div class="note">
Setelah klik tombol, kirim bukti pembayaran ke WhatsApp
</div>

<div class="trust">
✔ Aman • ✔ Cepat • ✔ Otomatis • ✔ Terpercaya
</div>

</div>

<script>
let produk = localStorage.getItem("produk");
let harga = localStorage.getItem("harga");

if(produk && harga){
document.getElementById("infoProduk").innerHTML =
`Produk: <b>${produk}</b><br>Harga: Rp ${harga}`;
}else{
document.getElementById("infoProduk").innerHTML =
"Produk tidak ditemukan";
}

function kirimWA(){
let pesan = encodeURIComponent(
`Halo Admin TOKOKITA DIGITAL

Saya sudah melakukan pembayaran.

Produk: ${produk}
Harga: Rp ${harga}

Mohon diproses ya. Terima kasih.`
);

window.location.href =
"https://wa.me/62895393200800?text="+pesan;
}
</script>

</body>
</html>
</body>
</html>
