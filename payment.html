<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran - TOKOKITA DIGITAL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0b1218;
--card:#111827;
--primary:#145a4a;
--primary-soft:#1f7a63;
--text:#e5e7eb;
--sub:#9ca3af;
--accent:#22c55e;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:var(--bg);
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:var(--card);
padding:25px;
border-radius:16px;
max-width:400px;
width:90%;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.logo{
width:70px;
margin-bottom:10px;
}

h2{
margin:5px 0;
}

.sub{
font-size:13px;
color:var(--sub);
margin-bottom:15px;
}

.produk{
background:#0f1720;
padding:10px;
border-radius:10px;
margin-bottom:15px;
font-size:13px;
}

.step{
text-align:left;
font-size:13px;
margin:10px 0;
color:var(--accent);
line-height:1.6;
}

.qris{
background:white;
padding:10px;
border-radius:12px;
margin:15px 0;
}

.qris img{
width:100%;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
font-size:14px;
cursor:pointer;
margin-top:10px;
}

/* tombol beda warna */
.btn-chat{
background:#2563eb;
}
.btn-chat:hover{
background:#1d4ed8;
}

.btn-bayar{
background:var(--primary);
}
.btn-bayar:hover{
background:var(--primary-soft);
}

.note{
font-size:12px;
color:var(--sub);
margin-top:10px;
}

.trust{
margin-top:10px;
font-size:12px;
color:var(--accent);
}
</style>

</head>

<body>

<div class="box">

<img src="logo.png" class="logo">

<h2>Pembayaran QRIS</h2>
<p class="sub">TOKOKITA DIGITAL</p>

<div class="produk" id="infoProduk">
Memuat produk...
</div>

<div class="step">
✔ Chat admin dulu (opsional)<br>
✔ Scan QRIS jika sudah deal<br>
✔ Klik konfirmasi setelah bayar
</div>

<div class="qris">
<img src="qris-gadozo.png">
</div>

<!-- 2 TOMBOL -->
<button class="btn-chat" onclick="chatAdmin()">Chat Admin (Sebelum Bayar)</button>
<button class="btn-bayar" onclick="kirimWA()">Saya Sudah Bayar</button>

<div class="note">
Disarankan chat admin terlebih dahulu untuk konfirmasi stok / layanan
</div>

<div class="trust">
✔ Aman • ✔ Cepat • ✔ Otomatis • ✔ Terpercaya
</div>

</div>

<script>
let produk = localStorage.getItem("produk");
let harga = localStorage.getItem("harga");

if(produk && harga){
document.getElementById("infoProduk").innerHTML =
`Produk: <b>${produk}</b><br>Harga: Rp ${harga}`;
}else{
document.getElementById("infoProduk").innerHTML =
"Produk tidak ditemukan";
}

// CHAT SEBELUM BAYAR
function chatAdmin(){
let pesan = encodeURIComponent(
`Halo Admin TOKOKITA DIGITAL

Saya ingin melakukan pembelian.

Produk: ${produk}
Harga: Rp ${harga}

Mohon konfirmasi terlebih dahulu sebelum saya melakukan pembayaran. Terima kasih.`
);

window.location.href =
"https://wa.me/62895393200800?text="+pesan;
}

// SETELAH BAYAR
function kirimWA(){
let pesan = encodeURIComponent(
`Halo Admin TOKOKITA DIGITAL

Saya sudah melakukan pembayaran.

Produk: ${produk}
Harga: Rp ${harga}

Berikut bukti pembayaran saya. Mohon diproses ya. Terima kasih.`
);

window.location.href =
"https://wa.me/62895393200800?text="+pesan;
}
</script>

</body>
</html>
