<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKOKITA DIGITAL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0b1218;
--card:#111827;
--primary:#145a4a;
--primary-soft:#1f7a63;
--text:#e5e7eb;
--sub:#9ca3af;
--accent:#22c55e;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{background:var(--bg);color:var(--text);}

/* HEADER */
header{
text-align:center;
padding:20px;
border-bottom:1px solid #1f2937;
}

.logo{width:60px;margin-bottom:10px;}

header h1{font-size:20px;}
header p{font-size:13px;color:var(--sub);}

.trust-bar{
margin-top:10px;
font-size:12px;
color:var(--accent);
}

/* CONTAINER */
.container{max-width:1100px;margin:auto;padding:20px;}

/* GRID */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

/* CARD */
.card{
background:var(--card);
border-radius:14px;
overflow:hidden;
transition:.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card:hover{transform:translateY(-5px);}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.card-body{padding:15px;}

.card h3{font-size:15px;margin-bottom:8px;}

.price{
color:var(--accent);
font-weight:bold;
margin-bottom:5px;
}

.desc{
font-size:12px;
color:var(--sub);
margin-bottom:8px;
}

/* BUTTON */
.btn{
width:100%;
padding:10px;
background:var(--primary);
border:none;
border-radius:8px;
color:white;
font-weight:bold;
cursor:pointer;
}

.btn:hover{background:var(--primary-soft);}

/* FOOTER */
.footer{
text-align:center;
font-size:12px;
color:#6b7280;
margin:30px 0;
}
</style>
</head>

<body>

<header>
<img src="logo.PNG" class="logo">
<h1>TOKOKITA DIGITAL</h1>
<p>Produk Digital Otomatis & Terpercaya</p>

<div class="trust-bar">
✔ Aman • ✔ Cepat • ✔ Otomatis • ✔ Trusted
</div>
</header>

<div class="container">
<div class="products" id="produk"></div>
</div>

<div class="footer">
© TOKOKITA DIGITAL
</div>

<script>
/* =========================
EDIT PRODUK DI SINI
========================= */

const produkList = [

["Ebook Dropship",75000,"Panduan lengkap jualan dari nol","https://via.placeholder.com/400x300"],

["Template Canva",60000,"100+ template siap pakai untuk bisnis","https://via.placeholder.com/400x300"],

["Aplikasi Premium",85000,"Unlock semua fitur tanpa batas","https://via.placeholder.com/400x300"],

["Kursus Online",100000,"Video belajar lengkap + mentor","https://via.placeholder.com/400x300"],

["Plugin Software",125000,"Tools produktivitas premium","https://via.placeholder.com/400x300"],

["Preset Foto",45000,"Preset aesthetic siap pakai","https://via.placeholder.com/400x300"],

["Script Website",150000,"Script siap pakai untuk jualan","https://via.placeholder.com/400x300"],

["Design Pack",80000,"Bundle desain premium lengkap","https://via.placeholder.com/400x300"],

["Music Digital",70000,"Audio kualitas tinggi","https://via.placeholder.com/400x300"],

["Bundle Premium",200000,"Paket lengkap hemat","https://via.placeholder.com/400x300"],

["Video Editing Pack",90000,"Template video siap pakai","https://via.placeholder.com/400x300"],

["AI Tools Premium",120000,"Akses tools AI terbaru","https://via.placeholder.com/400x300"]

];

/* =========================
JANGAN DIUBAH
========================= */

document.getElementById("produk").innerHTML = produkList.map(p=>`
<div class="card">

<img src="${p[3]}">

<div class="card-body">
<h3>${p[0]}</h3>

<div class="price">Rp ${p[1]}</div>

<div class="desc">${p[2]}</div>

<button class="btn" onclick="beli('${p[0]}','${p[1]}')">
Beli
</button>

</div>
</div>
`).join("");

function beli(nama,harga){
localStorage.setItem("produk",nama);
localStorage.setItem("harga",harga);
window.location.href="payment.html";
}
</script>

</body>
</html>
