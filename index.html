<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKOKITA DIGITAL</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}

body{
background:#0b1218;
color:#e5e7eb;
}

/* HEADER */
header{
padding:20px;
text-align:center;
border-bottom:1px solid #1f2937;
background:#0f1720;
}

.logo{
width:70px;
margin-bottom:10px;
}

header h1{
font-size:20px;
}

header p{
font-size:13px;
color:#9ca3af;
}

/* TRUST */
.trust-bar{
display:flex;
justify-content:center;
gap:15px;
font-size:12px;
color:#22c55e;
margin-top:10px;
flex-wrap:wrap;
}

/* CONTAINER */
.container{
max-width:1100px;
margin:auto;
padding:20px;
}

/* GRID */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

/* CARD */
.card{
background:#111827;
border-radius:14px;
overflow:hidden;
transition:.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:160px;
object-fit:cover;
}

.card-body{
padding:15px;
}

.card h3{
font-size:15px;
margin-bottom:8px;
}

.price{
color:#22c55e;
font-weight:bold;
margin-bottom:8px;
}

.desc{
font-size:12px;
color:#9ca3af;
margin-bottom:10px;
}

/* BUTTON */
.btn{
width:100%;
padding:10px;
background:#145a4a;
border:none;
border-radius:8px;
color:white;
font-weight:bold;
cursor:pointer;
}

.btn:hover{
background:#1f7a63;
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
display:none;
justify-content:center;
align-items:center;
}

.modal-content{
background:#111827;
padding:20px;
border-radius:12px;
width:90%;
max-width:400px;
text-align:center;
}

.modal img{
width:100%;
border-radius:10px;
background:white;
padding:8px;
}

.close{
margin-top:10px;
background:#374151;
}

/* WA FLOAT */
.wa-float{
position:fixed;
bottom:20px;
right:20px;
background:#25d366;
color:white;
padding:12px 15px;
border-radius:50px;
font-size:14px;
cursor:pointer;
}

/* FOOTER */
.footer{
text-align:center;
font-size:12px;
color:#6b7280;
margin:30px 0;
}
</style>
</head>

<body>

<header>
<img src="logo.png" class="logo">
<h1>TOKOKITA DIGITAL</h1>
<p>Produk Digital Otomatis & Terpercaya</p>

<div class="trust-bar">
<span>✔ Aman</span>
<span>✔ Otomatis</span>
<span>✔ 1-5 Menit</span>
<span>✔ Support 24 Jam</span>
</div>
</header>

<div class="container">
<div class="products">

<script>
const produkList = [
["Ebook Bisnis",50000],
["Template Canva",60000],
["Aplikasi Premium",75000],
["Kursus Online",100000],
["Plugin Software",125000],
["Preset Foto",45000],
["Script Website",150000],
["Design Pack",80000],
["Music Digital",70000],
["Bundle Premium",200000],
["Akun Premium Netflix",30000],
["Akun Canva Pro 1 Bulan",25000]
];

document.write(produkList.map(p=>`
<div class="card">
<img src="https://via.placeholder.com/400x300">
<div class="card-body">
<h3>${p[0]}</h3>
<div class="price">Rp ${p[1]}</div>
<div class="desc">Produk digital berkualitas & siap pakai.</div>
<button class="btn" onclick="checkout('${p[0]}','${p[1]}')">Beli</button>
</div>
</div>
`).join(""));
</script>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<h3>Scan QRIS</h3>
<img src="qris-gadozo.png">
<p style="font-size:13px;margin:10px;color:#9ca3af;">
Setelah bayar klik konfirmasi
</p>

<button class="btn" onclick="kirimWA()">Saya Sudah Bayar</button>
<button class="btn close" onclick="tutup()">Batal</button>
</div>
</div>

<div class="footer">
© TOKOKITA DIGITAL • All Rights Reserved
</div>

<div class="wa-float" onclick="waLangsung()">Chat Admin</div>

<script>
let produkDipilih="",hargaDipilih="";

function checkout(nama,harga){
produkDipilih=nama;
hargaDipilih=harga;
document.getElementById("modal").style.display="flex";
}

function tutup(){
document.getElementById("modal").style.display="none";
}

function kirimWA(){
let pesan=encodeURIComponent(
`Halo Admin TOKOKITA DIGITAL

Saya sudah bayar:
Produk: ${produkDipilih}
Harga: Rp ${hargaDipilih}

Mohon diproses ya.`
);

window.open("https://wa.me/62895393200800?text="+pesan);
}

function waLangsung(){
window.open("https://wa.me/62895393200800");
}
</script>

</body>
</html>
